name: Build ProTender APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Kunci tandatangan tetap (supaya APK baru boleh dikemas kini atas APK lama)
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - run: npm install
      - name: Sediakan fail app (Firebase & font dalam APK, tiada muat dari internet)
        run: |
          mkdir -p www/lib www/fonts
          cp -r index.html icons sounds www/
          sed -i 's#<head>#<head><script>window.PT_BUILD=${{ github.run_number }};</script>#' www/index.html
          grep -o 'window.PT_BUILD=[0-9]*' www/index.html
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js; do
            test -f node_modules/firebase/$f || { echo "TIADA $f"; ls node_modules/firebase | head -50; exit 1; }
            cp node_modules/firebase/$f www/lib/
          done
          FS=node_modules/@fontsource/bricolage-grotesque
          test -f $FS/400.css || { echo "TIADA font"; ls $FS; exit 1; }
          cp -r $FS/files www/fonts/
          cat $FS/400.css $FS/600.css $FS/800.css > www/fonts/bricolage.css
          sed -i 's#https://www.gstatic.com/firebasejs/10.12.2/#lib/#g' www/index.html
          sed -i 's#<link href="https://fonts.googleapis.com/css2[^"]*" rel="stylesheet">#<link href="fonts/bricolage.css" rel="stylesheet">#' www/index.html
          sed -i '/fonts.googleapis.com" *>$/d;/rel="preconnect"/d' www/index.html
          echo "--- pautan luar yang tinggal dalam www/index.html:"; grep -o 'https://[a-z.]*\(gstatic\|googleapis\)[^"]*' www/index.html || echo "(tiada)"
          ls -la www www/lib www/fonts | head -40
      - run: npx cap add android
      - name: Ikon app, ikon notifikasi & bunyi
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-icons/res/* $RES/
          mkdir -p $RES/raw
          cp sounds/*.wav $RES/raw/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0a1210</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
      - name: Permission notifikasi & alarm tepat
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Guna kunci tandatangan tetap dalam Gradle
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../android-signing/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
              }
          }
          GRADLE
          tail -16 android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ProTender.apk
      - name: Semak APK (kebenaran & isi)
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          $AAPT dump badging ProTender.apk | grep -E "^package|sdkVersion|targetSdk|application-label|uses-permission" || true
          unzip -l ProTender.apk | grep -E "assets/public/(index.html|lib/|fonts/bricolage.css)|res/raw/pt_" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ProTender-apk
          path: ProTender.apk
      - run: echo '{"build":${{ github.run_number }},"name":"1.0.${{ github.run_number }}"}' > apk-version.json
      - name: Terbit ke Release "latest" (muat turun terus dari telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProTender APK (terkini)
          body: "Muat turun ProTender.apk di bawah dan pasang di telefon Android."
          files: |
            ProTender.apk
            apk-version.json
          make_latest: true
      - name: Kemas kini salinan APK di GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
