name: Deploy ProTender Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sediakan fail web
        run: |
          mkdir -p _site && cp -r index.html download.html manifest.webmanifest sw.js icons sounds _site/
          curl -sSLf -o _site/ProTender.apk https://github.com/alemmaxx/ProTender/releases/download/latest/ProTender.apk && ls -la _site/ProTender.apk || echo "APK belum ada dalam Release"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
